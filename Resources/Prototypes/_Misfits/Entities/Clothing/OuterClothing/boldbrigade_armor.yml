  parent: N14FalloutArmorBase
  id: MisfitsBoldBrigadeVestReinforced
  name: Brigade Vest Reinforced
  description: "A sturdy vest with a chainmail shirt, reinforced with steel on the back and front. Provides good protection against ballistics and piercing alongside slashing."
