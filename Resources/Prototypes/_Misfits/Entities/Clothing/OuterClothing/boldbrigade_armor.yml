# Misfits Add - dedicated Bold Brigade armor variants.

- type: entity
  parent: N14FalloutArmorBase
  id: MisfitsBoldBrigadeVest
  name: Brigade Vest
  description: "A basic vest made out of steel and copper. Provides decent protection from slashing and piercing attacks, but has near no protection against bludgeons."
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Boldbrigade/OuterClothing/boldbrigade_vest.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Boldbrigade/OuterClothing/boldbrigade_vest.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.10
        Slash: 0.20
        Piercing: 0.20

- type: entity
  parent: N14FalloutArmorBase
  id: MisfitsBoldBrigadeVestChainmail
  name: Brigade Vest Chainmail
  description: "A basic vest made of steel and copper reinforced with a chainmail shirt. Provides good protection against slashing, decent against piercing, and next to none against bludgeoning."
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Boldbrigade/OuterClothing/boldbrigade_vest_chainmail.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Boldbrigade/OuterClothing/boldbrigade_vest_chainmail.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.10
        Slash: 0.30
        Piercing: 0.20

